# Publie le site Jeux-Concours sur GitHub Pages.
# - chaque jour à 5 h 17 (UTC) : collecte des concours (1 passage par jour, robots.txt respecté) ;
# - à chaque modification du code : republication SANS nouvelle collecte (on réutilise les données en ligne).
name: Site Jeux-Concours

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    paths: ["site/**", "extension/lib/**", "python/**", "tools/build_site.py", ".github/workflows/site.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      # On repart des données déjà en ligne : le script sait ainsi quelles sources
      # ont déjà été lues aujourd'hui (1 passage par jour et par source).
      - name: Reprise des données déjà en ligne
        run: |
          curl -fsSL "${{ steps.pages.outputs.base_url }}/data/concours.json" -o python/concours.json || true
          curl -fsSL "${{ steps.pages.outputs.base_url }}/data/etat.json" -o python/etat.json || true

      - name: Collecte du jour (sources pas encore lues aujourd'hui)
        if: github.event_name != 'push'
        run: python3 python/collecteur.py --sources site/sources.json

      - name: Assemblage du site
        run: python3 tools/build_site.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploiement
        uses: actions/deploy-pages@v4
